<!-- Theme switch: a moon icon and a switch, no box. Behaviour in theme.js (load once per page with defer). Its name is "Dark theme";
     aria-pressed is set by theme.js to match what is on screen. -->
<button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Dark theme">
  <svg class="icon icon-sm" aria-hidden="true"><use href="assets/icons.svg#i-moon"/></svg><span class="track" aria-hidden="true"><span class="knob"></span></span>
</button>
