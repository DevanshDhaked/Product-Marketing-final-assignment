<!-- Canonical <head> start for every Sphyr page. Copy as is; add the page <title> and description after it.
     Order matters: the colour-scheme meta and the inline theme script come before any stylesheet, so the
     stored theme applies on the first frame (no flash). Paths assume the page sits next to tokens.css. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("sphyr-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preload" href="fonts/manrope-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/newsreader-display-normal-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="icon" href="assets/sphyr-logo.svg" type="image/svg+xml">
